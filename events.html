<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفعاليات الوطنية والتوعوية - استوديو صحة الشباب</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="js/theme.js"></script>
    <style>
        .events-hero { background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95)), url('images/hero-bg.jpg') center/cover; color: white; padding: 5rem 1rem; text-align: center; border-radius: 0 0 32px 32px; margin-bottom: 2.5rem; position: relative; overflow: hidden; }
        .events-hero::after { content: ''; position: absolute; bottom: -20%; left: -5%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(2, 132, 199, 0.3) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
        .events-hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .events-hero p { font-size: 1.15rem; color: #e2e8f0; max-width: 650px; margin: 0 auto; line-height: 1.7; }
        
        .events-filters-wrapper { background: var(--surface-color); padding: 1.5rem; border-radius: 20px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 2.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .events-filters-top { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
        
        .search-box { display: flex; gap: 8px; flex: 1; min-width: 280px; max-width: 450px; position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 40px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); outline: none; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .search-box input:focus { border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); background: var(--surface-color); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 1.1rem; }
        
        .filter-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-btn { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .filter-btn:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: #cbd5e1; }
        .filter-btn.active { background: var(--brand-accent, #0284c7); color: white; border-color: var(--brand-accent, #0284c7); box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25); }
        
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.75rem; margin-bottom: 4rem; }
        .event-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; }
        .event-card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1); border-color: #cbd5e1; }
        
        .event-img-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; }
        .event-img { width: 100%; height: 100%; object-fit: cover; background: var(--bg-secondary); transition: transform 0.5s ease; }
        .event-card:hover .event-img { transform: scale(1.05); }
        .event-category-badge { position: absolute; top: 12px; right: 12px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px); color: var(--brand-accent); padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .event-body { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
        .event-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 12px; color: var(--text-primary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .event-meta-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
        .event-meta-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; }
        
        .seats-container { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); margin-bottom: 1rem; }
        .seats-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
        .seats-progress { background: var(--bg-secondary); height: 8px; border-radius: 4px; overflow: hidden; }
        .seats-fill { background: var(--brand-accent); height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .seats-fill.full { background: #ef4444; }
        .seats-fill.good { background: #10b981; }
        
        .calendar-view { display: none; background: var(--surface-color); border-radius: 20px; border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 4rem; box-shadow: var(--shadow-sm); }
        
        /* Shimmer Skeletons */
        .skeleton-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.75rem; width: 100%; }
        .skeleton-card { background: var(--surface-color); border-radius: 20px; border: 1px solid var(--border-color); overflow: hidden; }
        .skeleton-img { width: 100%; height: 200px; }
        .skeleton-content { padding: 1.5rem; display: flex; flex-direction: column; gap: 12px; }
        .skeleton-line { height: 16px; border-radius: 8px; }
        .skeleton-btn { height: 40px; border-radius: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <div class="events-hero">
        <div class="container">
            <h1>الفعاليات والأنشطة الوطنية للصحة</h1>
            <p>اكتشف أحدث الندوات والورش التفاعلية والملتقيات الصحية والتوعوية في جميع أنحاء المملكة.</p>
        </div>
    </div>

    <main class="container">
        <div class="events-filters-wrapper">
            <div class="events-filters-top">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="ابحث باسم الفعالية أو المدينة..." oninput="handleSearch()">
                    <span class="search-icon">🔍</span>
                </div>
                <button class="filter-btn" style="border-radius:12px; display:flex; align-items:center; gap:6px;" onclick="toggleCalendarView()" id="btn-toggle-view">
                    <span>📅</span> عرض التقويم
                </button>
            </div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterEvents('all')">جميع الفعاليات</button>
                <button class="filter-btn" onclick="filterEvents('psychology')">الصحة النفسية</button>
                <button class="filter-btn" onclick="filterEvents('health')">التوعية الصحية</button>
                <button class="filter-btn" onclick="filterEvents('digital')">الطب الرقمي</button>
                <button class="filter-btn" onclick="filterEvents('doctors')">فعاليات الأطباء</button>
            </div>
        </div>

        <div id="events-grid-container">
            <!-- Skeletons will show initially -->
            <div class="skeleton-wrapper" id="events-skeleton">
                <div class="skeleton-card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-line" style="width:30%;"></div>
                        <div class="skeleton skeleton-line" style="width:90%;"></div>
                        <div class="skeleton skeleton-line" style="width:70%;"></div>
                        <div class="skeleton skeleton-line" style="width:50%; margin-top:10px;"></div>
                        <div class="skeleton skeleton-btn"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-line" style="width:30%;"></div>
                        <div class="skeleton skeleton-line" style="width:90%;"></div>
                        <div class="skeleton skeleton-line" style="width:70%;"></div>
                        <div class="skeleton skeleton-line" style="width:50%; margin-top:10px;"></div>
                        <div class="skeleton skeleton-btn"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton skeleton-img"></div>
                    <div class="skeleton-content">
                        <div class="skeleton skeleton-line" style="width:30%;"></div>
                        <div class="skeleton skeleton-line" style="width:90%;"></div>
                        <div class="skeleton skeleton-line" style="width:70%;"></div>
                        <div class="skeleton skeleton-line" style="width:50%; margin-top:10px;"></div>
                        <div class="skeleton skeleton-btn"></div>
                    </div>
                </div>
            </div>
            
            <!-- Grid for Cards -->
            <div class="events-grid" id="events-grid" style="display:none;"></div>
        </div>

        <!-- Calendar Container -->
        <div class="calendar-view" id="calendar-container">
            <h3 style="margin-bottom:1rem;">جدول الفعاليات القادمة حسب التاريخ</h3>
            <div id="calendar-list" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
    </main>

    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/events.js"></script>
</body>
</html>
