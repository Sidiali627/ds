<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">من نحن - استوديو صحة الشباب</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <script type="module" src="js/seo_injector.js" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <section class="page-content">
        <div class="container" style="padding: var(--spacing-xl) var(--spacing-md);">
            <h1 id="page-title"></h1>
            <div id="page-body"></div>
        </div>
    </section>

    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module">
        import { fetchPageContent } from './js/cms.js';
        document.addEventListener('DOMContentLoaded', async () => {
            const content = await fetchPageContent('about');
            if (content && content.main) {
                document.getElementById('page-title').innerText = content.main.title || '';
                document.getElementById('page-body').innerHTML = content.main.body || '';
            }
        });
    </script>
</body>
</html>
