<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستشارات الطبية - استوديو صحة الشباب</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <script type="module" src="js/seo_injector.js" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <main class="main-content">
        <div class="container" style="max-width: 650px; margin-top: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--spacing-md);">
                <a href="dashboard.html" style="font-size:0.9rem; font-weight:700; color:var(--brand-accent); display:inline-flex; align-items:center; gap:6px;">
                    <span>←</span> العودة لاستشاراتي في لوحة التحكم
                </a>
                <span style="font-size:0.8rem; background:rgba(2, 132, 199, 0.1); color:var(--brand-accent); padding:4px 10px; border-radius:20px; font-weight:700;">سرية وآمنة 🔒</span>
            </div>

            <div style="text-align: center; margin-bottom: var(--spacing-lg);">
                <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:6px;">طلب استشارة طبية عن بعد</h1>
                <p style="color: var(--text-secondary); font-size:0.95rem; margin:0;">تواصل مع نخبة من الأطباء والمختصين بسرية تامة وسيتم تعيين الطبيب الأنسب لحالتك فوراً.</p>
            </div>
            
            <div style="background: var(--surface-color); padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--box-shadow); border: 1px solid var(--border-color);">
                <form id="consultation-form">
                    <div style="margin-bottom: var(--spacing-md);">
                        <label for="category" style="display:block; margin-bottom: var(--spacing-sm); font-weight:700;">تخصص الاستشارة المطلوب <span style="color:var(--danger-color);">*</span></label>
                        <select id="category" required style="width: 100%; padding: 0.85rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); font-family: inherit; font-size:0.95rem; background:var(--bg-secondary); color:var(--text-primary);">
                            <option value="psychology">🧠 الصحة النفسية والدعم التوجيهي</option>
                            <option value="nutrition">🥗 التغذية العلاجية والحميات</option>
                            <option value="general" selected>🩺 الطب العام والاستشارات الشاملة</option>
                        </select>
                    </div>

                    <div style="margin-bottom: var(--spacing-md);">
                        <label for="priority" style="display:block; margin-bottom: var(--spacing-sm); font-weight:700;">درجة الأهمية / الاستعجال</label>
                        <select id="priority" style="width: 100%; padding: 0.85rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); font-family: inherit; font-size:0.95rem; background:var(--bg-secondary); color:var(--text-primary);">
                            <option value="normal" selected>🟢 استشارة عادية (خلال 24-48 ساعة)</option>
                            <option value="urgent">🚨 استشارة عاجلة (خلال اليوم)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: var(--spacing-lg);">
                        <label for="description" style="display:block; margin-bottom: var(--spacing-sm); font-weight:700;">شرح الحالة والأعراض بالتفصيل <span style="color:var(--danger-color);">*</span></label>
                        <textarea id="description" rows="5" required placeholder="يرجى كتابة تفاصيل المشكلة الصحية، مدة ظهور الأعراض، وأي أدوية يتم تناولها حالياً لمساعدة الطبيب المختص..." style="width: 100%; padding: 0.85rem; border: 1px solid var(--border-color); border-radius: var(--border-radius); font-family: inherit; font-size:0.95rem; line-height:1.6; background:var(--bg-secondary); color:var(--text-primary);"></textarea>
                    </div>

                    <button type="submit" id="btn-submit-consultation" class="btn btn-primary" style="width: 100%; padding: 0.95rem; font-weight:800; font-size:1rem; border-radius:var(--border-radius);">
                        <span>إرسال طلب الاستشارة الآن</span>
                    </button>
                    
                    <div id="cons-msg-box" style="margin-top: var(--spacing-md); padding: 1rem; border-radius: var(--border-radius); display: none; text-align: center; font-weight: 700;"></div>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/consultations.js"></script>
</body>
</html>
