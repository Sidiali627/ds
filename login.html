<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - استوديو صحة الشباب</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <script type="module" src="js/seo_injector.js" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <div class="container" style="max-width: 500px; margin-top: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
        <div style="background: var(--surface-color); padding: var(--spacing-xl); border-radius: var(--border-radius); box-shadow: var(--box-shadow); text-align: center;">
            <h2>تسجيل الدخول</h2>
            <form id="login-form" style="text-align: right; margin-top: var(--spacing-md);">
                <div style="margin-bottom: var(--spacing-md);">
                    <label style="display:block; margin-bottom: var(--spacing-sm);">البريد الإلكتروني</label>
                    <input type="email" id="email" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                </div>
                <div style="margin-bottom: var(--spacing-md);">
                    <label style="display:block; margin-bottom: var(--spacing-sm);">كلمة المرور</label>
                    <input type="password" id="password" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--spacing-md);">
                    <a href="javascript:void(0)" id="btn-forgot-password" style="font-size:0.85rem; color:var(--brand-accent);">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">دخول</button>
                <p id="error-msg" style="color: var(--danger-color); margin-top: var(--spacing-sm); display: none;"></p>
            </form>
            <p style="margin-top: var(--spacing-sm);">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:var(--surface-color); padding:var(--spacing-xl); border-radius:var(--border-radius); max-width:420px; width:90%; border:1px solid var(--border-color); text-align:right;">
            <h3 style="margin-bottom:var(--spacing-sm);">استعادة كلمة المرور</h3>
            <p style="color:var(--text-secondary); font-size:0.88rem; margin-bottom:var(--spacing-md);">أدخل بريدك الإلكتروني المسجل وسنرسل لك رابطاً لتعيين كلمة مرور جديدة.</p>
            <form id="forgot-form">
                <input type="email" id="forgot-email" required placeholder="بريدك الإلكتروني" style="width:100%; padding:0.75rem; border:1px solid var(--border-color); border-radius:var(--border-radius); margin-bottom:var(--spacing-md);">
                <button type="submit" class="btn btn-primary" id="btn-submit-forgot" style="width:100%; margin-bottom:var(--spacing-sm);">إرسال رابط الاستعادة</button>
                <button type="button" class="btn btn-outline" id="btn-close-forgot" style="width:100%;">إلغاء</button>
            </form>
            <p id="forgot-status" style="margin-top:var(--spacing-sm); font-size:0.88rem; display:none;"></p>
        </div>
    </div>

    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module">
        import { signIn, resetPassword } from './js/auth.js';
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error, redirectUrl } = await signIn(document.getElementById('email').value, document.getElementById('password').value);
            if (error) { 
                const el = document.getElementById('error-msg'); 
                el.innerText = error.message; 
                el.style.display = 'block'; 
            } else if (redirectUrl) { 
                window.location.href = redirectUrl; 
            } else { 
                window.location.href = 'dashboard.html'; 
            }
        });

        const forgotModal = document.getElementById('forgot-modal');
        document.getElementById('btn-forgot-password').addEventListener('click', () => {
            forgotModal.style.display = 'flex';
        });
        document.getElementById('btn-close-forgot').addEventListener('click', () => {
            forgotModal.style.display = 'none';
        });

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            const statusEl = document.getElementById('forgot-status');
            const submitBtn = document.getElementById('btn-submit-forgot');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الإرسال...';
            statusEl.style.display = 'none';

            const { error } = await resetPassword(email);
            submitBtn.disabled = false;
            submitBtn.innerText = 'إرسال رابط الاستعادة';

            statusEl.style.display = 'block';
            if (error) {
                statusEl.style.color = 'var(--danger-color)';
                statusEl.innerText = error.message;
            } else {
                statusEl.style.color = 'var(--success-color)';
                statusEl.innerText = 'تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني بنجاح.';
                setTimeout(() => { forgotModal.style.display = 'none'; }, 3500);
            }
        });
    </script>
</body>
</html>
