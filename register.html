<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - استوديو صحة الشباب</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

    <script type="module" src="js/seo_injector.js" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <div class="container" style="max-width: 500px; margin-top: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
        <div style="background: var(--surface-color); padding: var(--spacing-xl); border-radius: var(--border-radius); box-shadow: var(--box-shadow); text-align: center;">
            <h2>إنشاء حساب جديد</h2>
            <form id="register-form" style="text-align: right; margin-top: var(--spacing-md);">
                <div style="margin-bottom: var(--spacing-md);">
                    <label style="display:block; margin-bottom: var(--spacing-sm);">الاسم الكامل</label>
                    <input type="text" id="fullname" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                </div>
                <div style="margin-bottom: var(--spacing-md);">
                    <label style="display:block; margin-bottom: var(--spacing-sm);">البريد الإلكتروني</label>
                    <input type="email" id="email" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                </div>
                <div style="margin-bottom: var(--spacing-md);">
                    <label style="display:block; margin-bottom: var(--spacing-sm);">كلمة المرور</label>
                    <input type="password" id="password" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">إنشاء حساب</button>
                <p id="error-msg" style="color: var(--danger-color); margin-top: var(--spacing-sm); display: none;"></p>
                <p id="success-msg" style="color: var(--success-color); margin-top: var(--spacing-sm); display: none;">تم إنشاء الحساب بنجاح.</p>
            </form>
            <p style="margin-top: var(--spacing-md);">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
        </div>
    </div>
    
    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module">
        import { signUp } from './js/auth.js';
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await signUp(document.getElementById('email').value, document.getElementById('password').value, document.getElementById('fullname').value);
            if (error) { const el = document.getElementById('error-msg'); el.innerText = error.message; el.style.display = 'block'; }
            else { document.getElementById('success-msg').style.display = 'block'; setTimeout(() => window.location.href = 'login.html', 3000); }
        });
    </script>
</body>
</html>
