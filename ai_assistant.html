<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي (YHS AI) | استوديو صحة الشباب</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <style>
        body { background: var(--bg-color); min-height: 100vh; display: flex; flex-direction: column; }
        .ai-navbar { background: var(--surface-color); padding: 1rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .ai-logo { font-size: 1.5rem; font-weight: 800; color: var(--primary-color); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .ai-container { flex: 1; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; padding: 2rem 1rem; }
        
        .messages-wrapper { flex: 1; overflow-y: auto; padding-bottom: 2rem; display: flex; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
        
        .msg { display: flex; gap: 1rem; max-width: 90%; }
        .msg-user { align-self: flex-start; }
        .msg-ai { align-self: flex-start; }
        
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; }
        .msg-user .msg-avatar { background: var(--primary-color); color: white; }
        .msg-ai .msg-avatar { background: linear-gradient(135deg, #10b981, #3b82f6); color: white; }
        
        .msg-bubble { padding: 1rem 1.5rem; border-radius: 16px; font-size: 1rem; line-height: 1.7; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .msg-user .msg-bubble { background: var(--surface-color); border: 1px solid var(--border-color); border-top-right-radius: 4px; color: var(--text-color); }
        .msg-ai .msg-bubble { background: transparent; color: var(--text-color); width: 100%; }
        
        .msg-ai .msg-bubble p { margin-top: 0; }
        .msg-ai .msg-bubble pre { background: rgba(0,0,0,0.05); padding: 1rem; border-radius: 8px; overflow-x: auto; }
        
        .input-area { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 24px; padding: 0.5rem; display: flex; align-items: flex-end; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: sticky; bottom: 2rem; margin-top: 1rem; }
        .input-box { flex: 1; border: none; background: transparent; padding: 12px 16px; color: var(--text-color); font-family: inherit; font-size: 1rem; resize: none; max-height: 150px; outline: none; }
        .send-btn { background: var(--primary-color); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; margin: 4px; }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .suggestion-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; justify-content: center; }
        .chip { background: var(--surface-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 99px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; color: var(--text-color); }
        .chip:hover { border-color: var(--primary-color); color: var(--primary-color); }
    </style>

    <script type="module" src="js/seo_injector.js" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>

    <nav class="ai-navbar">
        <a href="index.html" class="ai-logo">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 12"></path><path d="M12 12l8.5 4.9"></path><path d="M12 12l8.5-4.9"></path></svg>
            YHS Assistant
        </a>
        <a href="index.html" class="btn btn-outline">العودة للمنصة</a>
    </nav>

    <div class="ai-container">
        
        <div class="suggestion-chips" id="welcome-chips">
            <div class="chip" onclick="sendChip('ما هي الخدمات التي يقدمها الاستوديو؟')">الخدمات التي نقدمها</div>
            <div class="chip" onclick="sendChip('كيف يمكنني حجز استشارة نفسية؟')">حجز استشارة</div>
            <div class="chip" onclick="sendChip('اقترح لي مقالات عن إدارة التوتر')">مقالات عن التوتر</div>
            <div class="chip" onclick="sendChip('كيف أتطوع معكم؟')">التطوع معنا</div>
        </div>

        <div class="messages-wrapper" id="messages-container">
            <div style="text-align:center; padding: 3rem 0; color:var(--admin-text-muted);" id="welcome-msg">
                <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:1rem; color:var(--primary-color);"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 12"></path><path d="M12 12l8.5 4.9"></path><path d="M12 12l8.5-4.9"></path></svg>
                <h2>مرحباً بك في المساعد الذكي</h2>
                <p>أنا هنا للإجابة عن أسئلتك واقتراح المحتوى المناسب لك.</p>
            </div>
        </div>

        <div class="input-area">
            <textarea id="chat-input" class="input-box" placeholder="اسألني أي شيء..." onkeydown="handleEnter(event)"></textarea>
            <button id="btn-send" class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/ai_engine.js"></script>
    <script type="module" src="js/user_ai.js"></script>
</body>
</html>
