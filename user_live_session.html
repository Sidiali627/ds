<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الاستشارة والمحادثة المباشرة - استوديو صحة الشباب</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/guard.js"></script>
    <style>
        body { background-color: var(--bg-primary); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Cairo', system-ui, sans-serif; }
        .ls-header { background: var(--surface-color); color: var(--text-primary); padding: 0.9rem 1.75rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 10; box-shadow: var(--shadow-sm); }
        .ls-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .ls-video-container { display: none; background: #0f172a; height: 45vh; min-height: 250px; position: relative; border-bottom: 1px solid var(--border-color); }
        .ls-video-grid { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; box-sizing: border-box; }
        .ls-video-box { background: #1e293b; border-radius: 16px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .ls-video-box video { width: 100%; height: 100%; object-fit: cover; }
        .ls-video-label { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; }

        .ls-video-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 20px; z-index: 5; border: 1px solid rgba(255,255,255,0.15); }
        .ls-btn-ctrl { background: rgba(255,255,255,0.15); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
        .ls-btn-ctrl:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .ls-btn-ctrl.danger { background: #ef4444; }

        .ls-chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: var(--bg-primary); }
        .ls-msg-group { display: flex; flex-direction: column; max-width: 75%; }
        .ls-msg-group.user { align-self: flex-end; }
        .ls-msg-group.doctor { align-self: flex-start; }
        
        .ls-msg-bubble { padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; box-shadow: var(--shadow-sm); }
        .ls-msg-group.user .ls-msg-bubble { background: var(--brand-accent); color: white; border-bottom-left-radius: 4px; }
        .ls-msg-group.doctor .ls-msg-bubble { background: var(--surface-color); color: var(--text-primary); border: 1px solid var(--border-color); border-bottom-right-radius: 4px; }
        .ls-msg-time { font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px; }

        .ls-input-area { background: var(--surface-color); padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; }
        .ls-input-wrapper { flex: 1; position: relative; }
        .ls-input-wrapper textarea { width: 100%; border: 1px solid var(--border-color); border-radius: 20px; padding: 12px 16px; background: var(--bg-secondary); color: var(--text-primary); resize: none; font-family: inherit; font-size: 0.95rem; outline: none; }
        .ls-send-btn { background: var(--brand-accent); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }

        .ls-typing-indicator { font-size: 0.8rem; color: var(--text-secondary); padding: 0 1.5rem 8px 1.5rem; font-style: italic; display: none; }
    </style>
</head>
<body>
    <div class="ls-header">
        <div style="display:flex; align-items:center; gap:12px;">
            <a href="dashboard.html" class="btn btn-outline" style="padding:6px 14px; border-radius:12px; font-size:0.85rem;">&rarr; عودة للوحة التحكم</a>
            <div>
                <h3 style="margin:0; font-size:1.1rem; font-weight:800;">جلسة استشارية مرئية حية 🟢</h3>
                <span style="font-size:0.8rem; color:var(--text-secondary);" id="session-info">جلسة مباشرة آمنة</span>
            </div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="btn btn-primary" style="border-radius:12px; padding:8px 16px;" onclick="startVideoCall()">📹 بدء المكالمة المرئية</button>
            <button class="btn btn-outline" style="border-radius:12px; padding:8px 16px; color:#ef4444; border-color:#ef4444;" onclick="document.getElementById('rating-modal').style.display = 'flex'">إنهاء الجلسة والتقييم</button>
        </div>
    </div>

    <div class="ls-body">
        <!-- Video Conference Grid -->
        <div class="ls-video-container" id="video-container">
            <div class="ls-video-grid">
                <div class="ls-video-box">
                    <video id="remote-video" autoplay playsinline></video>
                    <div class="ls-video-label">الطبيب المختص</div>
                </div>
                <div class="ls-video-box">
                    <video id="local-video" autoplay playsinline muted></video>
                    <div class="ls-video-label">أنت (المستفيد)</div>
                </div>
            </div>
            <div class="ls-video-controls">
                <button class="ls-btn-ctrl" onclick="toggleAudio()" id="btn-audio" title="كتم/تشغيل الصوت">🎙️</button>
                <button class="ls-btn-ctrl" onclick="toggleVideo()" id="btn-video" title="إيقاف/تشغيل الكاميرا">📷</button>
                <button class="ls-btn-ctrl" onclick="shareScreen()" id="btn-screen" title="مشاركة الشاشة">🖥️</button>
                <button class="ls-btn-ctrl danger" onclick="endVideoCall()" title="إنهاء المكالمة المرئية">📵</button>
            </div>
        </div>

        <!-- Chat Messages Feed -->
        <div class="ls-chat-messages" id="chat-messages">
            <div style="text-align:center; padding:1.5rem; color:var(--text-secondary); font-size:0.88rem;">
                بداية المحادثة الاستشارية الآمنة مع الطبيب 🔒
            </div>
        </div>

        <div class="ls-typing-indicator" id="doctor-typing">الطبيب يكتب الآن...</div>

        <!-- Chat Input Bar -->
        <div class="ls-input-area">
            <div class="ls-input-wrapper">
                <textarea id="chat-input" placeholder="اكتب رسالتك للطبيب الاستشاري هنا..." rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
            </div>
            <button class="ls-send-btn" onclick="sendMessage()" title="إرسالالرسالة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
        </div>
    </div>

    <!-- Patient Rating Modal -->
    <div class="modal" id="rating-modal" style="display:none; position:fixed; inset:0; background:rgba(15, 23, 42, 0.7); backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:var(--surface-color); padding:2.25rem; border-radius:24px; max-width:420px; width:100%; text-align:center; border:1px solid var(--border-color); box-shadow:var(--shadow-xl);">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:4px;">تقييم الاستشارة والطبيب</h3>
            <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:1.25rem;">كيف كانت تجربتك في الجلسة الاستشارية اليوم؟</p>
            <div style="font-size:2.2rem; color:#f59e0b; margin-bottom:1.25rem; cursor:pointer;" id="star-rating">
                <span onclick="setRating(1)">⭐</span>
                <span onclick="setRating(2)">⭐</span>
                <span onclick="setRating(3)">⭐</span>
                <span onclick="setRating(4)">⭐</span>
                <span onclick="setRating(5)">⭐</span>
            </div>
            <textarea id="rating-comment" placeholder="اكتب ملاحظاتك أو انطباعك عن الطبيب..." rows="3" style="width:100%; padding:12px; border-radius:12px; border:1px solid var(--border-color); background:var(--bg-secondary); color:var(--text-primary); margin-bottom:1.25rem; font-family:inherit;"></textarea>
            <button class="btn btn-primary" style="width:100%; border-radius:14px; padding:12px; font-weight:800;" onclick="submitPatientRating()">حفظ التقييم وإغلاق الجلسة ✅</button>
        </div>
    </div>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/user_live_session.js"></script>
</body>
</html>
