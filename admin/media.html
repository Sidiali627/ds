<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الوسائط - Media Manager</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.3);
            --blur: blur(20px);
            --media-sidebar: 240px;
            --media-panel: 320px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(17, 24, 39, 0.8);
                --glass-border: rgba(255, 255, 255, 0.05);
            }
        }

        .media-layout {
            display: grid;
            grid-template-columns: var(--media-sidebar) 1fr var(--media-panel);
            gap: 1.5rem;
            height: calc(100vh - 140px); /* Fill remaining space */
            align-items: start;
        }
        @media (max-width: 1200px) {
            .media-layout { grid-template-columns: var(--media-sidebar) 1fr; }
            .media-details-panel { display: none !important; }
        }

        .media-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 20px;
            height: 100%;
            overflow-y: auto;
            box-shadow: var(--card-shadow);
            position: relative;
        }

        /* Sidebar Folders */
        .folder-list { list-style: none; padding: 1rem; margin: 0; }
        .folder-item {
            padding: 12px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            color: var(--text-color); font-weight: 500; transition: all 0.2s; margin-bottom: 4px;
        }
        .folder-item:hover { background: rgba(0,0,0,0.03); }
        .folder-item.active { background: rgba(26, 86, 219, 0.1); color: var(--primary-color); font-weight: 600; }
        .folder-icon { opacity: 0.7; }
        .folder-item.active .folder-icon { opacity: 1; stroke: var(--primary-color); }

        /* Main Grid */
        .media-toolbar { padding: 1rem; border-bottom: 1px solid var(--admin-border); display: flex; justify-content: space-between; align-items: center; background: var(--surface-color); position: sticky; top: 0; z-index: 10; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; padding: 1rem; }
        
        .media-card {
            border: 1px solid var(--admin-border); border-radius: 12px; overflow: hidden; cursor: pointer;
            transition: all 0.2s; background: var(--bg-color); position: relative; aspect-ratio: 1;
        }
        .media-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-color: var(--primary-color); }
        .media-card.selected { border: 2px solid var(--primary-color); box-shadow: 0 0 0 4px rgba(26,86,219,0.2); }
        
        .media-thumb { width: 100%; height: 100%; object-fit: cover; background: #f0f0f0; }
        @media (prefers-color-scheme: dark) { .media-thumb { background: #1f2937; } }
        
        .media-icon-fallback {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.02); flex-direction: column; color: var(--admin-text-muted);
        }
        
        .media-name-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            color: white; font-size: 0.75rem; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Right Panel Details */
        .media-details-panel { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .details-thumb { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: rgba(0,0,0,0.05); border-radius: 8px; margin-bottom: 1rem; }
        .detail-row { display: flex; flex-direction: column; margin-bottom: 12px; font-size: 0.9rem; }
        .detail-label { color: var(--admin-text-muted); font-weight: 500; font-size: 0.8rem; margin-bottom: 4px; }
        .detail-val { color: var(--text-color); font-weight: 600; word-break: break-all; }
        
        .upload-zone {
            border: 2px dashed var(--primary-color); border-radius: 12px; padding: 2rem; text-align: center;
            background: rgba(26,86,219,0.02); transition: all 0.3s; cursor: pointer; margin-bottom: 1rem;
        }
        .upload-zone.dragover { background: rgba(26,86,219,0.1); border-width: 3px; transform: scale(1.02); }

        .search-bar { padding: 8px 16px; border-radius: 99px; border: 1px solid var(--admin-border); background: var(--bg-color); color: var(--text-color); width: 200px; font-family: inherit; }
        .search-bar:focus { outline: none; border-color: var(--primary-color); }

        .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; color: var(--admin-text-muted); }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }
    </style>
    <script type="module" src="../js/theme.js"></script>
    <script type="module" src="../js/guard.js"></script>
    <script type="module" src="../js/admin_components.js"></script>
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>

        <main class="admin-main">
            <div id="admin-header-root"></div>

            <div class="admin-content" style="padding-bottom: 0;">
                <div class="media-layout">
                    
                    <!-- Left Sidebar (Folders) -->
                    <div class="media-box">
                        <ul class="folder-list">
                            <li class="folder-item active" onclick="filterMedia('all')">
                                <svg class="folder-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                                جميع الملفات
                            </li>
                            <li class="folder-item" onclick="filterMedia('image')">
                                <svg class="folder-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                الصور
                            </li>
                            <li class="folder-item" onclick="filterMedia('video')">
                                <svg class="folder-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                                الفيديوهات
                            </li>
                            <li class="folder-item" onclick="filterMedia('document')">
                                <svg class="folder-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                المستندات (PDF)
                            </li>
                            <li style="margin: 1rem 0; border-top: 1px solid var(--admin-border);"></li>
                            <li class="folder-item" onclick="filterMedia('deleted')" style="color:var(--danger-color);">
                                <svg class="folder-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                سلة المحذوفات
                            </li>
                        </ul>
                    </div>

                    <!-- Main Grid -->
                    <div class="media-box" style="display:flex; flex-direction:column;">
                        <div class="media-toolbar">
                            <input type="text" id="media-search" class="search-bar" placeholder="ابحث باسم الملف أو الوسم..." oninput="searchMedia()">
                            <div>
                                <input type="file" id="file-input" multiple style="display:none;" onchange="handleFilesUpload(this.files)">
                                <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">+ رفع ملفات</button>
                            </div>
                        </div>
                        
                        <div id="drop-zone" class="upload-zone" style="display:none; margin:1rem;">
                            قم بإفلات الملفات هنا للرفع الفوري (يتم الضغط تلقائياً للصور)
                        </div>

                        <div class="media-grid" id="media-grid">
                            <!-- Populated via JS -->
                            <div class="empty-state">جاري التحميل...</div>
                        </div>
                    </div>

                    <!-- Right Panel (Details) -->
                    <div class="media-box media-details-panel" id="details-panel" style="display:none;">
                        <img loading="lazy" decoding="async" id="d-thumb" class="details-thumb" src="" alt="preview">
                        
                        <div class="detail-row">
                            <span class="detail-label">اسم الملف</span>
                            <span class="detail-val" id="d-name">--</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">الرابط المباشر (URL)</span>
                            <div style="display:flex; gap:8px;">
                                <input type="text" id="d-url" readonly style="width:100%; border:1px solid var(--admin-border); background:var(--bg-color); color:var(--text-color); border-radius:4px; padding:4px 8px; font-size:0.8rem;">
                                <button class="btn btn-outline" style="padding:4px 8px; font-size:0.8rem;" onclick="copyUrl()">نسخ</button>
                            </div>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">النوع</span>
                            <span class="detail-val" id="d-type">--</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">الحجم</span>
                            <span class="detail-val" id="d-size">--</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">تاريخ الرفع</span>
                            <span class="detail-val" id="d-date">--</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">مكان الاستخدام</span>
                            <span class="detail-val" id="d-usage">غير محدد</span>
                        </div>

                        <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
                            <button id="btn-restore" class="btn btn-success" style="display:none;" onclick="restoreFile()">استعادة من سلة المحذوفات</button>
                            <button id="btn-delete" class="btn btn-outline" style="color:var(--danger-color); border-color:var(--danger-color);" onclick="deleteFile()">نقل لسلة المحذوفات</button>
                            <button id="btn-hard-delete" class="btn btn-danger" style="display:none;" onclick="hardDeleteFile()">حذف نهائي (لا يمكن التراجع)</button>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/supabase.js"></script>
    <script type="module" src="../js/admin_media.js"></script>
</body>
</html>
