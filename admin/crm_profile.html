<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile 360° - CRM Center</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        .profile-layout { display: grid; grid-template-columns: 350px 1fr; gap: 1.5rem; align-items: start; }
        
        /* Premium Card */
        .premium-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--card-shadow);
        }

        .avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--border-color); margin: 0 auto 1rem; display: block; }
        .user-name-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
        .user-role-badge { display: table; margin: 0 auto 1.5rem; padding: 4px 12px; border-radius: 99px; font-weight: 600; font-size: 0.85rem; }
        
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--admin-text-muted); font-weight: 500; }
        .info-val { font-weight: 600; color: var(--text-color); }

        /* Tags */
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .tag { background: rgba(26, 86, 219, 0.1); color: var(--primary-color); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .tag-remove { cursor: pointer; opacity: 0.5; }
        .tag-remove:hover { opacity: 1; color: var(--danger-color); }
        .add-tag-input { border: 1px dashed var(--border-color); background: transparent; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; outline: none; color: var(--text-color); width: 100px; }
        .add-tag-input:focus { border-color: var(--primary-color); }

        /* Notes */
        .notes-area { width: 100%; border: 1px solid #f59e0b; background: rgba(245, 158, 11, 0.05); border-radius: 8px; padding: 12px; font-family: inherit; font-size: 0.9rem; color: var(--text-color); resize: vertical; margin-top: 8px; }
        .notes-area:focus { outline: none; box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }

        /* Timeline */
        .timeline { position: relative; padding-right: 1.5rem; margin-top: 1rem; }
        .timeline::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: var(--border-color); }
        .timeline-item { position: relative; margin-bottom: 1.5rem; }
        .timeline-item::before { content: ''; position: absolute; right: -1.5rem; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color); border: 2px solid var(--surface-color); transform: translateX(50%); }
        .tl-date { font-size: 0.8rem; color: var(--admin-text-muted); margin-bottom: 4px; }
        .tl-content { background: rgba(0,0,0,0.02); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.95rem; }

        .tabs-nav { display: flex; gap: 8px; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .tab-btn { background: transparent; border: none; color: var(--admin-text-muted); padding: 8px 16px; font-weight: 600; cursor: pointer; border-radius: 8px; }
        .tab-btn:hover { background: rgba(0,0,0,0.03); }
        .tab-btn.active { background: var(--primary-color); color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @media (max-width: 992px) { .profile-layout { grid-template-columns: 1fr; } }
    </style>
    <script type="module" src="../js/theme.js"></script>
    <script type="module" src="../js/guard.js"></script>
    <script type="module" src="../js/admin_components.js"></script>
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>

        <main class="admin-main">
            <div id="admin-header-root"></div>

            <div class="admin-content">
                <div class="profile-layout">
                    
                    <!-- Left Column: Identity & CRM Metadata -->
                    <div>
                        <div class="premium-card">
                            <img loading="lazy" decoding="async" src="" id="p-avatar" class="avatar-large" alt="User Avatar" onerror="this.src='../images/default-avatar.png'">
                            <div class="user-name-title" id="p-name">جاري التحميل...</div>
                            <div class="user-role-badge" id="p-role-badge" style="background:var(--border-color); color:var(--text-color);">--</div>

                            <div class="info-row"><span class="info-label">رقم الهاتف:</span> <span class="info-val" id="p-phone">--</span></div>
                            <div class="info-row"><span class="info-label">الولاية:</span> <span class="info-val" id="p-wilaya">--</span></div>
                            <div class="info-row"><span class="info-label">تاريخ الميلاد:</span> <span class="info-val" id="p-birth">--</span></div>
                            <div class="info-row"><span class="info-label">تاريخ التسجيل:</span> <span class="info-val" id="p-created">--</span></div>
                            <div class="info-row"><span class="info-label">حالة الحساب:</span> 
                                <select id="p-status" class="add-tag-input" style="width:auto;" onchange="updateStatus(this.value)">
                                    <option value="active">نشط</option>
                                    <option value="inactive">غير مفعل</option>
                                    <option value="banned">محظور</option>
                                </select>
                            </div>
                        </div>

                        <div class="premium-card">
                            <h3 style="margin-bottom: 0.5rem; font-size: 1rem;">التصنيفات (Tags)</h3>
                            <div class="tags-container" id="p-tags-container">
                                <!-- Tags will be injected here -->
                            </div>
                            <input type="text" id="add-tag-input" class="add-tag-input" placeholder="+ إضافة Tag" onkeypress="handleTagInput(event)" style="margin-top:12px; width:100%;">
                        </div>

                        <div class="premium-card" style="border-color:#f59e0b;">
                            <h3 style="margin-bottom: 0.5rem; font-size: 1rem; color: #d97706;">ملاحظات الإدارة (Internal Notes)</h3>
                            <textarea id="p-notes" class="notes-area" rows="4" placeholder="اكتب ملاحظة خاصة عن هذا المستخدم... لا يراها سواه المدراء."></textarea>
                            <button class="btn btn-outline" style="width:100%; margin-top:8px; border-color:#f59e0b; color:#d97706;" onclick="saveNotes()">حفظ الملاحظات</button>
                        </div>
                    </div>

                    <!-- Right Column: Activity & Timeline -->
                    <div class="premium-card" style="padding-top: 1rem;">
                        <div class="tabs-nav">
                            <button class="tab-btn active" data-target="tab-timeline">الخط الزمني (Timeline)</button>
                            <button class="tab-btn" data-target="tab-consultations">الاستشارات</button>
                            <button class="tab-btn" data-target="tab-events">الفعاليات</button>
                        </div>

                        <!-- Timeline Tab -->
                        <div id="tab-timeline" class="tab-content active">
                            <h3 style="margin-bottom: 1rem;">سجل النشاط الشامل</h3>
                            <div class="timeline" id="p-timeline">
                                <div style="color:var(--admin-text-muted); text-align:center; padding:2rem;">جاري جلب السجل...</div>
                            </div>
                        </div>

                        <!-- Consultations Tab -->
                        <div id="tab-consultations" class="tab-content">
                            <div style="color:var(--admin-text-muted); text-align:center; padding:2rem;">لا توجد استشارات سابقة لهذا المستخدم.</div>
                        </div>

                        <!-- Events Tab -->
                        <div id="tab-events" class="tab-content">
                            <div style="color:var(--admin-text-muted); text-align:center; padding:2rem;">لم يسجل في أي فعالية بعد.</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/supabase.js"></script>
    <script type="module" src="../js/admin_crm_profile.js"></script>
    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });
    </script>
</body>
</html>
