<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الشهادات الذكية - الإدارة</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <!-- Libraries for PDF and QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <style>
        .cert-panel {
            background: var(--surface-color); border: 1px solid var(--border-color, #e2e8f0);
            border-radius: 20px; padding: 1.5rem; margin-bottom: 1.75rem; box-shadow: var(--card-shadow); transition: all 0.25s ease;
        }

        .tabs-nav { display: flex; gap: 8px; margin-bottom: 2rem; border-bottom: 1px solid var(--admin-border); padding-bottom: 12px; }
        .tab-btn { background: transparent; border: none; color: var(--admin-text-muted); padding: 8px 20px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .tab-btn:hover { background: rgba(0,0,0,0.03); }
        .tab-btn.active { background: var(--primary-color); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Certificate Preview Container */
        .cert-preview-wrapper { width: 100%; overflow-x: auto; padding: 1rem; background: rgba(0,0,0,0.02); border-radius: 12px; border: 1px dashed var(--admin-border); display: flex; justify-content: center; }
        
        /* The Actual Certificate DOM (A4 Landscape aspect ratio roughly 1.414) */
        .cert-dom {
            width: 842px; height: 595px; background: white; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background-size: cover; background-position: center; overflow: hidden; color: black;
            /* Scale down for UI viewing to avoid massive scrolling */
            transform: scale(0.8); transform-origin: top center; margin-bottom: -100px;
        }
        .cert-title { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 32px; font-weight: bold; color: inherit; }
        .cert-name { position: absolute; top: 240px; width: 100%; text-align: center; font-size: 42px; font-weight: bold; color: inherit; }
        .cert-activity { position: absolute; top: 320px; width: 100%; text-align: center; font-size: 24px; color: inherit; }
        .cert-date { position: absolute; bottom: 80px; left: 80px; font-size: 18px; font-weight: bold; }
        .cert-qr { position: absolute; bottom: 50px; right: 50px; width: 100px; height: 100px; }
        .cert-seal { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; opacity: 0.8; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-input, .form-select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; }
        
        .badge { padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
        .badge-valid { background: rgba(16,185,129,0.1); color: var(--success-color); border: 1px solid var(--success-color); }
        .badge-cancelled { background: rgba(239,68,68,0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
    </style>
    <script type="module" src="../js/theme.js"></script>
    <script type="module" src="../js/guard.js"></script>
    <script type="module" src="../js/admin_components.js"></script>
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-root"></div>

        <main class="admin-main">
            <div id="admin-header-root"></div>

            <div class="admin-content">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-target="tab-issue">إصدار وإدارة الشهادات</button>
                    <button class="tab-btn" data-target="tab-templates">قوالب الشهادات</button>
                </div>

                <!-- Tab 1: Manage & Issue -->
                <div id="tab-issue" class="tab-content active">
                    <div class="cert-panel" style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0;">إصدار شهادة جديدة</h3>
                        <button class="btn btn-primary" onclick="openIssueModal()">+ إصدار شهادة</button>
                    </div>
                    
                    <div class="cert-panel">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>رقم الشهادة (ID)</th>
                                    <th>المستفيد</th>
                                    <th>النشاط</th>
                                    <th>التاريخ</th>
                                    <th>الحالة</th>
                                    <th>إجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="cert-tbody">
                                <tr><td colspan="6" style="text-align:center;">جاري التحميل...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Tab 2: Templates -->
                <div id="tab-templates" class="tab-content">
                    <div class="cert-panel">
                        <h3 style="margin-bottom:1rem;">القوالب المتاحة</h3>
                        <button class="btn btn-outline" onclick="createDefaultTemplate()" style="margin-bottom:1rem;">إنشاء القالب الافتراضي</button>
                        <div id="templates-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:1rem;">
                            <!-- Templates -->
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Issue Certificate Form (Hidden by default, shown via JS as a simple inline block or modal for simplicity we'll just put it below) -->
    <div id="issue-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
        <div class="cert-panel" style="width:500px; max-width:90%;">
            <h3 style="margin-bottom:1rem;">بيانات الشهادة</h3>
            <div class="form-group" style="margin-bottom:1rem;">
                <label>اسم المستفيد</label>
                <input type="text" id="c_name" class="form-input">
            </div>
            <div class="form-group" style="margin-bottom:1rem;">
                <label>اسم النشاط / الدورة</label>
                <input type="text" id="c_activity" class="form-input">
            </div>
            <div class="form-group" style="margin-bottom:1rem;">
                <label>تاريخ الإصدار</label>
                <input type="date" id="c_date" class="form-input">
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label>القالب</label>
                <select id="c_template" class="form-select"></select>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn btn-outline" onclick="document.getElementById('issue-modal').style.display='none'">إلغاء</button>
                <button class="btn btn-primary" onclick="submitCertificate()">إصدار وحفظ</button>
            </div>
        </div>
    </div>

    <!-- Hidden DOM used for PDF Generation -->
    <div style="display:none;">
        <div id="pdf-container" class="cert-dom">
            <div class="cert-title" id="pdf-title">شهادة شكر وتقدير</div>
            <div class="cert-name" id="pdf-name">الاسم</div>
            <div class="cert-activity" id="pdf-activity">المشاركة</div>
            <div class="cert-date" id="pdf-date">التاريخ</div>
            <div class="cert-qr" id="pdf-qr"></div>
            <!-- Background will be set via inline style -->
        </div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/supabase.js"></script>
    <script type="module" src="../js/admin_certificates.js"></script>
    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });
    </script>
</body>
</html>
