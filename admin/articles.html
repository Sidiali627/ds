<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المقالات - الإدارة</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="../js/theme.js"></script>
    <script type="module" src="../js/guard.js"></script>
    <script type="module" src="../js/admin_components.js"></script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <div id="admin-sidebar-root"></div>

        <!-- Main -->
        <main class="admin-main">
            <div id="admin-header-root"></div>

            <div class="admin-content">
                <div class="admin-panel-header" style="background: transparent; border: none; padding: 0 0 1.5rem 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h2 style="margin: 0; font-weight: 800; font-size: 1.5rem;">إدارة المقالات التوعوية</h2>
                        <p style="color: var(--text-secondary); margin: 4px 0 0; font-size: 0.9rem;">نشر وتحرير المقالات الصحية والشبابية ومراجعة مسودات التثقيف الصحي.</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-primary" id="btn-new-article" style="display: inline-flex; align-items: center; gap: 6px;">
                            <span>➕</span>
                            <span>إضافة مقال جديد</span>
                        </button>
                    </div>
                </div>

                <div class="advanced-table-wrapper">
                    <div class="table-responsive">
                        <table class="advanced-table">
                            <thead>
                                <tr>
                                    <th>عنوان المقال</th>
                                    <th>الحالة</th>
                                    <th>تاريخ الإنشاء</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="articles-tbody">
                                <tr><td colspan="4" style="text-align:center; padding:3rem; color:var(--admin-text-muted);">جاري تحميل المقالات...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Style Override for Admin -->
    <style>
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 2000; display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--admin-surface); width: 100%; max-width: 600px;
            border-radius: 12px; padding: 2rem; border: 1px solid var(--admin-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
    </style>

    <div id="article-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem;">إضافة مقال جديد</h3>
            <form id="article-form">
                <label class="form-label">العنوان</label>
                <input type="text" id="art-title" class="form-control" style="margin-bottom: 1rem;" required>
                
                <label class="form-label">رابط الصورة (اختياري)</label>
                <input type="text" id="art-image" class="form-control" style="margin-bottom: 1rem;">
                
                <label class="form-label">المحتوى</label>
                <textarea id="art-content" class="form-control" rows="6" style="margin-bottom: 1.5rem;" required></textarea>
                
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" id="btn-close-modal" style="border-radius: 6px;">إلغاء</button>
                    <button type="submit" class="btn btn-primary" style="border-radius: 6px;">نشر المقال</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/supabase.js"></script>
    <script type="module" src="../js/admin_articles.js"></script>
</body>
</html>
