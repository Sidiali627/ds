<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفعاليات الوطنية والملتقيات - لوحة الإدارة</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="../js/theme.js"></script>
    <script type="module" src="../js/guard.js"></script>
    <script type="module" src="../js/admin_components.js"></script>
</head>
<body>
    <div class="admin-layout">
        <!-- Unified Dynamic Sidebar -->
        <div id="admin-sidebar-root"></div>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Unified Dynamic Header -->
            <div id="admin-header-root"></div>

            <div class="admin-content">
                <!-- Action Header -->
                <div class="admin-panel-header" style="background: transparent; border: none; padding: 0 0 1.5rem 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h2 style="margin: 0; font-weight: 800; font-size: 1.5rem;">إدارة الفعاليات الوطنية والملتقيات</h2>
                        <p style="color: var(--text-secondary); margin: 4px 0 0; font-size: 0.9rem;">إنشاء وتعديل الفعاليات الوطنية، ومتابعة تسجيلات وتذاكر حضور الشباب.</p>
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="openCreateModal()" style="display: inline-flex; align-items: center; gap: 6px;">
                            <span>➕</span>
                            <span>إضافة فعالية جديدة</span>
                        </button>
                    </div>
                </div>

                <!-- Advanced Table Component -->
                <div class="advanced-table-wrapper">
                    <div class="table-toolbar">
                        <div class="table-search">
                            <input type="text" id="eventSearchInput" class="form-control" placeholder="بحث بعنوان الفعالية أو المدينة..." aria-label="البحث عن فعالية">
                        </div>
                        <div class="table-filters">
                            <select id="eventCategoryFilter" class="form-control" aria-label="تصفية حسب التصنيف">
                                <option value="all">كافة التصنيفات</option>
                                <option value="psychology">صحة نفسية</option>
                                <option value="nutrition">تغذية ولياقة</option>
                                <option value="health">طب وقائي</option>
                                <option value="youth">فعاليات الشباب</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="advanced-table">
                            <thead>
                                <tr>
                                    <th>العنوان</th>
                                    <th>التصنيف</th>
                                    <th>التاريخ والوقت</th>
                                    <th>الموقع والمدينة</th>
                                    <th>المقاعد المتاحة</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="events-tbody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: 3rem; color: var(--admin-text-muted);">
                                        <div style="font-size: 1.5rem; margin-bottom: 8px;">⏳</div>
                                        <div>جاري تحميل الفعاليات...</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create / Edit Event Unified Modal -->
    <div class="modal-overlay" id="event-modal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">إضافة فعالية جديدة</h3>
                <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="event-form" onsubmit="saveEvent(event)">
                <div class="modal-body">
                    <input type="hidden" id="ev-id">
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; display: block;">عنوان الفعالية *</label>
                        <input type="text" id="ev-title" class="form-control" required style="width: 100%;">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; display: block;">التصنيف *</label>
                        <select id="ev-category" class="form-control" style="width: 100%;">
                            <option value="psychology">صحة نفسية</option>
                            <option value="nutrition">تغذية ولياقة</option>
                            <option value="health">طب وقائي</option>
                            <option value="youth">فعاليات الشباب</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; display: block;">التاريخ والوقت *</label>
                        <input type="datetime-local" id="ev-date" class="form-control" required style="width: 100%;">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; display: block;">الموقع والمدينة *</label>
                        <input type="text" id="ev-location" class="form-control" required style="width: 100%;">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; display: block;">إجمالي المقاعد *</label>
                        <input type="number" id="ev-total-seats" class="form-control" value="100" required style="width: 100%;">
                    </div>
                    <div class="form-group" style="margin-bottom: 8px;">
                        <label class="form-label" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 6px; display: block;">وصف الفعالية</label>
                        <textarea id="ev-desc" class="form-control" rows="3" style="width: 100%;"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" style="padding: 8px 18px;">حفظ الفعالية</button>
                    <button type="button" class="btn btn-outline" onclick="closeModal()" style="padding: 8px 16px;">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/supabase.js"></script>
    <script type="module" src="../js/admin_events.js"></script>
</body>
</html>
