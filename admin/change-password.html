<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - الإدارة</title>
    
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--background-color);
        }
        .login-card {
            background: var(--surface-color);
            padding: var(--spacing-xl);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card img {
            height: 60px;
            margin: 0 auto var(--spacing-lg);
        }
        .form-group {
            margin-bottom: var(--spacing-md);
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: inherit;
        }
        .btn-full {
            width: 100%;
            margin-top: var(--spacing-md);
        }
        .error-message { color: var(--danger-color); margin-top: var(--spacing-md); display: none; }
        .success-message { color: var(--success-color); margin-top: var(--spacing-md); display: none; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="../js/theme.js"></script>
    <script type="module" src="../js/guard.js"></script>
    <script type="module" src="../js/admin_components.js"></script>
</head>
<body>

    <div class="login-card">
        <img loading="lazy" decoding="async" src="../images/logo.png" alt="الشعار">
        <h2>تأمين حسابك</h2>
        <p style="margin-bottom: var(--spacing-md); color: var(--text-secondary);">لأسباب أمنية (أول تسجيل دخول)، يجب عليك تغيير كلمة المرور الأولية.</p>
        
        <form id="change-password-form">
            <div class="form-group">
                <label for="new_password">كلمة المرور الجديدة</label>
                <input type="password" id="new_password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">تأكيد كلمة المرور</label>
                <input type="password" id="confirm_password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full">تحديث كلمة المرور والدخول</button>
            <p class="error-message" id="error-msg"></p>
            <p class="success-message" id="success-msg">تم تغيير كلمة المرور بنجاح. جاري التحويل...</p>
        </form>
    </div>

    <!-- JS -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/supabase.js"></script>
    <script type="module">
        import { supabase } from '../js/supabase.js';
        
        document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            
            errorMsg.style.display = 'none';
            
            if (newPassword !== confirmPassword) {
                errorMsg.innerText = "كلمتا المرور غير متطابقتين.";
                errorMsg.style.display = 'block';
                return;
            }

            // Update user password in Auth
            const { error: authError } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (authError) {
                errorMsg.innerText = authError.message;
                errorMsg.style.display = 'block';
                return;
            }
            
            // Mark must_change_password as FALSE in profiles
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                await supabase.from('profiles').update({ must_change_password: false }).eq('id', user.id);
            }

            successMsg.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        });
    </script>
</body>
</html>
