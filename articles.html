<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المقالات - استوديو صحة الشباب</title>
    
    <!-- Performance Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://xsuednrcrzbjdyrdrgat.supabase.co">
<link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <style>
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--spacing-lg); margin-top: var(--spacing-xl); }
        .article-card { background: var(--surface-color); border-radius: var(--border-radius); box-shadow: var(--box-shadow); overflow: hidden; transition: transform var(--transition-speed); }
        .article-card:hover { transform: translateY(-5px); }
        .article-card img { width: 100%; height: 200px; object-fit: cover; }
        .article-content { padding: var(--spacing-md); }
        .article-content h3 { margin-bottom: var(--spacing-sm); }
    </style>

    <script type="module" src="js/seo_injector.js" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <div class="container" style="padding: var(--spacing-xl) var(--spacing-md);">
        <h1>أحدث المقالات</h1>
        <div class="articles-grid" id="articles-container"></div>
    </div>

    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module">
        import { fetchArticles } from './js/data.js';
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('articles-container');
            const articles = await fetchArticles();
            if (articles.length === 0) { container.innerHTML = '<p>لا توجد مقالات.</p>'; return; }
            articles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'article-card';
                const img = article.image_url ? `<img loading="lazy" decoding="async" src="${article.image_url}" alt="${article.title}">` : '<div style="height:200px;background:#e2e8f0;"></div>';
                card.innerHTML = `${img}<div class="article-content"><h3>${article.title}</h3><a href="article.html?id=${article.id}" class="btn btn-primary">اقرأ المزيد</a></div>`;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
