<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل دور الشباب - استوديو صحة الشباب</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="js/theme.js"></script>
</head>
<body>
    <header class="main-header" id="main-header"></header>

    <main class="container" style="padding:2rem 1rem; display:grid; gap:1rem;">
        <section class="card" style="padding:1rem;">
            <h1 style="margin-top:0;">دليل دور الشباب المعتمدة</h1>
            <p style="color:var(--text-secondary);">يتم عرض المؤسسات المعتمدة والمنشورة فقط.</p>
            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0.75rem;">
                <input id="yh-search" type="search" placeholder="ابحث بالاسم أو المعرف" aria-label="بحث">
                <select id="yh-wilaya-filter" aria-label="تصفية حسب الولاية"><option value="">كل الولايات</option></select>
                <select id="yh-commune-filter" aria-label="تصفية حسب البلدية"><option value="">كل البلديات</option></select>
            </div>
            <p id="yh-count" style="margin-top:0.75rem; color:var(--text-secondary);">عدد النتائج: 0</p>
        </section>

        <section id="yh-list" class="articles-grid" aria-live="polite"></section>
        <section id="yh-pagination" style="display:flex; align-items:center; justify-content:center; gap:0.75rem;"></section>
    </main>

    <footer class="main-footer" id="main-footer"></footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/youth_houses.js"></script>
</body>
</html>
